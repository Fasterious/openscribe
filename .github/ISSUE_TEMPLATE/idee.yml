name: "Proposer une amélioration / Suggest an improvement"
description: "Une idée précise pour OpenScribe. / A concrete idea for OpenScribe."
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Une idée encore floue, une envie d'en discuter ? Commencez par les [Discussions](https://github.com/Fasterious/openscribe/discussions). Ce formulaire sert aux propositions précises.
        *English is welcome.*
  - type: textarea
    id: need
    attributes:
      label: "Le besoin / The need"
      description: "Qui en a besoin, dans quelle situation, et ce qui bloque aujourd'hui. Partez de la recherche, pas de la solution."
      placeholder: "Quand je compare les réponses de deux segments de participants, je dois…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Ce que vous proposez / What you suggest"
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: "Principes du projet / Project principles"
      description: "Voir le [guide de contribution](https://github.com/Fasterious/openscribe/blob/main/CONTRIBUTING.md). Une proposition qui en contredit un sera refusée."
      options:
        - label: "Le moteur d'IA propose, le code vérifie et calcule tous les chiffres. / The AI proposes, the code checks and computes every number."
          required: true
        - label: "Aucune donnée ni clé ne passe par un serveur du projet. / No data or key goes through a project server."
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Autres pistes envisagées / Alternatives considered"
  - type: dropdown
    id: help
    attributes:
      label: "Souhaitez-vous la réaliser ? / Would you like to build it?"
      options:
        - "Oui / Yes"
        - "Avec de l'aide / With some help"
        - "Non / No"
